<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Yazısı — HSD Gelişim</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --navy: #04067c;
            --blue: #0028a5;
            --accent: #0d6efd;
        }
        body { font-family: 'Inter', sans-serif; }
        html.dark body { background: #0d1117; }
        .yazi-icerik { white-space: pre-wrap; line-height: 1.85; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-[#0d1117]">

<!-- NAVBAR -->
<nav class="bg-[#04067c] py-4 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 flex items-center justify-between">
        <a href="index.html" class="text-white font-extrabold text-lg">HSD Gelişim</a>
        <div class="hidden lg:flex items-center gap-6">
            <a href="duyurular.html" class="text-white font-medium hover:text-gray-300 transition">Duyurular</a>
            <a href="blog.html" class="text-white font-medium hover:text-gray-300 transition">Blog</a>
            <a href="komiteler.html" class="text-white font-medium hover:text-gray-300 transition">Komiteler</a>
            <a href="iletisim.html" class="text-white font-medium hover:text-gray-300 transition">İletişim</a>
        </div>
    </div>
</nav>

<main class="py-12">
    <article class="max-w-3xl mx-auto px-4">

        <a href="blog.html" class="text-blue-700 dark:text-blue-300 text-sm font-semibold hover:underline">← Tüm yazılar</a>

        <!-- Yükleniyor -->
        <div id="yukleniyor" class="mt-10 text-center text-gray-400 text-sm">
            Yazı yükleniyor…
        </div>

        <!-- Hata -->
        <div id="hata" class="mt-10 hidden bg-red-50 border border-red-200 text-red-700 rounded-xl px-5 py-4 text-sm"></div>

        <!-- İçerik -->
        <div id="yazi" class="hidden mt-6 bg-white dark:bg-[#1a1e23] border border-gray-200 dark:border-gray-800 rounded-3xl p-8 md:p-10">
            <span id="kategori" class="hidden bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full mb-4 inline-block"></span>

            <h1 id="baslik" class="text-3xl md:text-4xl font-extrabold text-gray-900 dark:text-white leading-tight mb-4"></h1>

            <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-gray-400 text-sm mb-8 pb-6 border-b border-gray-100 dark:border-gray-800">
                <span id="yazar"></span>
                <span id="tarih"></span>
                <span id="okuma"></span>
                <span id="goruntulenme"></span>
            </div>

            <div id="icerik" class="yazi-icerik text-gray-700 dark:text-gray-300"></div>

            <div id="etiketler" class="mt-8 pt-6 border-t border-gray-100 dark:border-gray-800 flex flex-wrap gap-2"></div>
        </div>

    </article>
</main>

<footer class="bg-[#04067c] text-white py-10 mt-10">
    <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-4">
        <p class="text-sm text-blue-200">© 2025 HSD Gelişim — Tüm hakları saklıdır.</p>
        <div class="flex items-center gap-5">
            <a href="https://www.instagram.com/hsdgelisim/" target="_blank" class="text-blue-200 hover:text-white transition text-sm">Instagram</a>
            <a href="https://www.linkedin.com/company/hsdigu/" target="_blank" class="text-blue-200 hover:text-white transition text-sm">LinkedIn</a>
            <a href="mailto:hsd.iguu@gmail.com" class="text-blue-200 hover:text-white transition text-sm">E-posta</a>
        </div>
    </div>
</footer>

<script src="js/api.js"></script>
<script src="js/blog-detay.js"></script>
</body>
</html>
