        ? uye.resim

    kart.className = 'uye-kart bg-white dark:bg-[#1a1e23] border border-gray-200 dark:border-gray-800 rounded-2xl p-6 text-center';

        <div class="w-20 h-20 rounded-full overflow-hidden mx-auto mb-4 border-2" style="border-color:${komite.renk}">

              style="background:${komite.renk}20; color:${komite.renk}">${uye.bolum}</span>
        ${uye.linkedin ? `<p class="text-xs text-gray-400 mt-2">LinkedIn →</p>` : ''}

// ── MODAL ─────────────────────────────────────────────────────────
const modal      = document.getElementById('modal');
const modalIcerik = document.getElementById('modalIcerik');

function acModal(uye, avatarUrl) {
    modalIcerik.innerHTML = `
        <div class="w-28 h-28 rounded-full overflow-hidden mx-auto mb-5 border-4" style="border-color:${komite.renk}">
            <img src="${avatarUrl}" alt="${uye.isim}" class="w-full h-full object-cover"
                 onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(uye.isim)}&background=${komite.renk.replace('#','')}&color=fff&size=112'">
        </div>
        <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-1">${uye.isim}</h3>
        <span class="text-sm font-medium px-4 py-1 rounded-full inline-block mb-4"
              style="background:${komite.renk}20; color:${komite.renk}">${uye.bolum}</span>
        ${uye.linkedin
            ? `<div class="mt-4">
                 <a href="${uye.linkedin}" target="_blank"
                    class="inline-flex items-center gap-2 bg-blue-700 hover:bg-blue-800 text-white text-sm font-semibold px-5 py-2 rounded-full transition">
                     LinkedIn Profili →
                 </a>
               </div>`
            : `<p class="text-sm text-gray-400 mt-2">LinkedIn profili henüz eklenmedi.</p>`
        }
    `;
    modal.classList.remove('hidden');
    modal.classList.add('flex');
}

function kapat() { modal.classList.add('hidden'); modal.classList.remove('flex'); }
document.getElementById('modalKapat').addEventListener('click', kapat);
modal.addEventListener('click', e => { if (e.target === modal) kapat(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') kapat(); });

// ── DARK MODE ─────────────────────────────────────────────────────
const html = document.documentElement;
const btns = [document.getElementById('darkModeBtn'), document.getElementById('darkModeBtnMobile')];

function applyTheme(isDark) {
    html.classList.toggle('dark', isDark);
    btns.forEach(b => b && (b.textContent = isDark ? '☀️' : '🌙'));
    localStorage.setItem('tema', isDark ? 'dark' : 'light');
}
applyTheme(localStorage.getItem('tema') === 'dark');
btns.forEach(btn => btn && btn.addEventListener('click', () => applyTheme(!html.classList.contains('dark'))));

// ── MOBİL MENÜ ───────────────────────────────────────────────────
const menuBtn    = document.getElementById('menuBtn');
const mobileMenu = document.getElementById('mobileMenu');
if (menuBtn) {
    menuBtn.addEventListener('click', () => mobileMenu.classList.toggle('hidden'));
    mobileMenu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => mobileMenu.classList.add('hidden')));
}
</script>
</body>
</html>
